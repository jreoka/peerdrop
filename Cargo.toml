[package]
name = "voidhop"
version = "0.1.0"
edition = "2024"
description = "Completely peer-to-peer serverless cross-platform file and directory transfer tool"

[dependencies]
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
hkdf = "0.13.0"
hmac = "0.13.0"
indicatif = "0.18.6"
libp2p = { version = "0.57.1", features = ["tcp", "dns", "tokio", "noise", "yamux", "mdns", "request-response", "identify", "macros"] }
libp2p-stream = "0.5.0-alpha"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
walkdir = "2.5.0"
bs58 = "0.5.1"
tempfile = "3"
if-addrs = "0.15.0"
